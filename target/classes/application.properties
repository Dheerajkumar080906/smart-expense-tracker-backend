# Server Port (Binds to PORT provided by cloud hosts like Render/Railway/Heroku, defaults to 8080)
server.port=${PORT:8080}

# Database Configuration (Defaults to embedded H2 file database)
# In production with PostgreSQL, override via environment variables:
# SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:<port>/<dbname>
# SPRING_DATASOURCE_USERNAME=<user>
# SPRING_DATASOURCE_PASSWORD=<password>
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/expense_tracker;AUTO_SERVER=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# Schema Initialization
spring.sql.init.mode=always

# H2 Console (disabled by default in production; enabled if SPRING_H2_CONSOLE_ENABLED=true)
spring.h2.console.enabled=${SPRING_H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# CORS Settings (Configurable via CORS_ALLOWED_ORIGINS, default allows all for easy frontend integration)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Production Actuator & Health Check
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
